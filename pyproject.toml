[project]
name = "swarm-field"
version = "0.1.0"
description = "A decentralized swarm algorithm and simulation for robots cultivating and monitoring a crop field."
readme = "README.md"
authors = [
    { name = "Blazej Lytkowski", email = "blazej.lytkowski@gmail.com" },
]
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["uv_build>=0.9.24,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "matplotlib>=3.8",
    "pyrefly>=1.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Design docs contain illustrative, hand-formatted Python snippets — keep Ruff out of them.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]

[tool.pyrefly]
project-includes = ["src", "tests"]
search-path = ["src", "."]
python-version = "3.12"
# Visualization is an optional technology behind the Renderer port (examples use
# `uv run --with matplotlib`); treat it as untyped so checks stay green either way.
replace-imports-with-any = ["matplotlib", "matplotlib.*"]
# Strict type checking. On top of the strict preset we require fully-typed public
# surface: every parameter, every return type, and every attribute must be annotated.
# (Local variables remain inferred — that is standard even under strict typing.)
preset = "strict"

[tool.pyrefly.errors]
unannotated-parameter = true
unannotated-return = true
unannotated-attribute = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
